name: Automation CI Pipeline

on:
  push:
    branches:
      - feature/allure-ci-integration

  workflow_dispatch:
    inputs:
      project:
        description: "Project to test"
        required: true
        default: "ida"
        type: choice
        options:
          - ida
          - nas

      environment:
        description: "Environment to test against"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - pathqa
          - staging
          - demo

      browser:
        description: "Browser"
        required: false
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    env:
      PROJECT: ${{ github.event.inputs.project || 'ida' }}
      ENV_NAME: ${{ github.event.inputs.environment || 'dev' }}
      BROWSER: ${{ github.event.inputs.browser || 'chrome' }}

    steps:
      - name: Validate project-environment combination
        shell: bash
        run: |
          echo "Validating selection..."
          echo "Project  : $PROJECT"
          echo "Env       : $ENV_NAME"
          echo "Browser   : $BROWSER"

          case "$PROJECT" in
            ida)
              case "$ENV_NAME" in
                dev|pathqa|demo)
                  echo "Valid combination for IDA"
                  ;;
                *)
                  echo "Invalid environment '$ENV_NAME' for project 'ida'. Allowed: dev, pathqa, demo"
                  exit 1
                  ;;
              esac
              ;;
            nas)
              case "$ENV_NAME" in
                staging|demo)
                  echo "Valid combination for NAS"
                  ;;
                *)
                  echo "Invalid environment '$ENV_NAME' for project 'nas'. Allowed: staging, demo"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Invalid project '$PROJECT'. Allowed: ida, nas"
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: "17"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Generate UUID CSV
        shell: bash
        run: |
          echo "Running UUID generator..."
          python src/test/resources/testdata/csvgen.py
          echo "Listing generated files:"
          ls -la src/test/resources/testdata || true

      - name: Install JMeter
        shell: bash
        run: |
          JMETER_VERSION="5.5"
          echo "Downloading JMeter ${JMETER_VERSION}..."
          curl -sSL -o apache-jmeter.tgz "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          tar -xzf apache-jmeter.tgz
          ls -la apache-jmeter-${JMETER_VERSION} || true

      - name: Run JMeter Test (non-GUI)
        shell: bash
        run: |
          mkdir -p results
          JMETER_DIR="./apache-jmeter-5.5"
          JMETER_BIN="${JMETER_DIR}/bin/jmeter"

          echo "Using JMeter binary: $JMETER_BIN"

          "$JMETER_BIN" -n \
            -t src/test/resources/testdata/QAsync_createpatients.jmx \
            -l results/jmeter-results-${{ github.run_id }}.jtl \
            -j results/jmeter-${{ github.run_id }}.log

          echo "JMeter exit code: $?"

      - name: Run Maven tests
        shell: bash
        run: |
          echo "Running suite → project: $PROJECT | env: $ENV_NAME | browser: $BROWSER"
          mvn clean test \
            -Dproject="$PROJECT" \
            -Denv="$ENV_NAME" \
            -Dbrowser="$BROWSER" \
            -Dheadless=true
        continue-on-error: true

      - name: Check allure results
        shell: bash
        run: |
          if [ -d target/allure-results ]; then
            echo "Allure results found"
            ls -la target/allure-results
          else
            echo "Creating empty allure-results"
            mkdir -p target/allure-results
          fi

      - name: Install Allure CLI
        shell: bash
        run: |
          curl -Ls -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
          sudo tar -zxvf allure.tgz -C /opt/
          sudo ln -sf /opt/allure-2.24.1/bin/allure /usr/bin/allure
          allure --version

      - name: Generate Allure report
        shell: bash
        run: |
          mkdir -p allure-report
          allure generate target/allure-results --clean -o allure-report \
            --report-name "IDA/NAS Regression — $PROJECT / $ENV_NAME" || true

          if [ ! -f allure-report/index.html ]; then
            echo "Creating fallback report"
            cat > allure-report/index.html <<EOF
          <html>
            <body style="font-family:sans-serif;">
              <h2>No Allure results found for $PROJECT / $ENV_NAME</h2>
            </body>
          </html>
          EOF
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add Allure report link to summary
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          echo "## 🚀 Automation Execution Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Project** | \`$PROJECT\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Env** | \`$ENV_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Browser** | \`$BROWSER\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Open Allure Report]($PAGE_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Send email with report link
        if: always()
        env:
          MAIL_CONNECTION: ${{ secrets.MAIL_CONNECTION }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PROJECT: ${{ env.PROJECT }}
          ENV_NAME: ${{ env.ENV_NAME }}
          BROWSER: ${{ env.BROWSER }}
        shell: bash
        run: |
          python3 <<'EOF'
          import os, smtplib, ssl
          from urllib.parse import urlparse
          from email.message import EmailMessage

          conn = os.getenv("MAIL_CONNECTION")
          if not conn:
              print("MAIL_CONNECTION missing")
              raise SystemExit(0)

          parsed = urlparse(conn)
          username = parsed.username
          password = parsed.password
          host = parsed.hostname
          port = parsed.port or 587

          page_url = os.getenv("PAGE_URL", "")
          project = os.getenv("PROJECT", "ida")
          env_name = os.getenv("ENV_NAME", "dev")
          browser = os.getenv("BROWSER", "chrome")
          repo = os.getenv("REPO", "")
          run_id = os.getenv("RUN_ID", "")

          msg = EmailMessage()
          msg["Subject"] = f"[{project.upper()} | {env_name.upper()}] Automation Allure Report"
          msg["From"] = username
          msg["To"] = username

          msg.add_alternative(f"""
          <h2>Automation Report Ready</h2>
          <table cellpadding="8" style="border-collapse:collapse;font-family:sans-serif;">
            <tr><td><b>Project</b></td><td>{project.upper()}</td></tr>
            <tr><td><b>Environment</b></td><td>{env_name.upper()}</td></tr>
            <tr><td><b>Browser</b></td><td>{browser}</td></tr>
          </table>
          <br>
          <p>
            <a href="{page_url}" style="padding:10px 20px;background:#4CAF50;color:white;
               text-decoration:none;border-radius:4px;font-weight:bold;">
              VIEW ALLURE REPORT
            </a>
          </p>
          <br>
          <p>
            <a href="https://github.com/{repo}/actions/runs/{run_id}">
              View Workflow Run on GitHub
            </a>
          </p>
          """, subtype="html")

          context = ssl.create_default_context()
          with smtplib.SMTP(host, port) as server:
              server.starttls(context=context)
              server.login(username, password)
              server.send_message(msg)

          print("EMAIL SENT SUCCESSFULLY")
          EOF
